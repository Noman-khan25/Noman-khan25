<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Noman Khan animated GitHub profile banner">
<defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#2563EB"><animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#06B6D4" stop-opacity=".22"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="clip"><rect x="10" y="10" width="1160" height="590" rx="30"/></clipPath>
  <pattern id="noise" width="70" height="70" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="12" r="1" fill="#0F172A" opacity=".05"/>
    <circle cx="43" cy="51" r=".8" fill="#0F172A" opacity=".04"/>
    <circle cx="62" cy="24" r=".7" fill="#0F172A" opacity=".04"/>
  </pattern>
</defs>

<rect width="1180" height="610" fill="#FFFFFF"/>
<g clip-path="url(#clip)">
  <rect x="10" y="10" width="1160" height="590" rx="30" fill="#F8FAFC" stroke="rgba(15,23,42,.10)" stroke-width="2"/>
  <circle cx="80" cy="90" r="250" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="cx" values="80;170;80" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="530" r="300" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="cy" values="530;440;530" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="10" y="10" width="1160" height="590" fill="url(#noise)"/>

  <!-- shimmer border -->
  <rect x="12" y="12" width="1156" height="586" rx="29" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="180 1100" opacity=".75">
    <animate attributeName="stroke-dashoffset" from="0" to="-1280" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- LEFT ASCII TERMINAL -->
  <g transform="translate(45 55)">
    <rect width="390" height="500" rx="22" fill="#FFFFFF" fill-opacity=".60" stroke="rgba(15,23,42,.10)"/>
    <circle cx="25" cy="25" r="5" fill="#FF5F57"/><circle cx="42" cy="25" r="5" fill="#FEBC2E"/><circle cx="59" cy="25" r="5" fill="#28C840"/>
    <text x="82" y="29" fill="#475569" font-family="monospace" font-size="13">noman@ai:~</text>

    <g transform="translate(25 75)" fill="url(#accent)" font-family="monospace" font-size="14" font-weight="700">
      <text y="0" opacity="0">        ██████╗ ██╗
        <animate attributeName="opacity" values="0;1" begin=".3s" dur=".5s" fill="freeze"/>
      </text>
      <text y="19" opacity="0">       ██╔═══██╗██║
        <animate attributeName="opacity" values="0;1" begin=".55s" dur=".5s" fill="freeze"/>
      </text>
      <text y="38" opacity="0">       ██║   ██║██║
        <animate attributeName="opacity" values="0;1" begin=".8s" dur=".5s" fill="freeze"/>
      </text>
      <text y="57" opacity="0">       ██║   ██║██║
        <animate attributeName="opacity" values="0;1" begin="1.05s" dur=".5s" fill="freeze"/>
      </text>
      <text y="76" opacity="0">       ╚██████╔╝██║
        <animate attributeName="opacity" values="0;1" begin="1.3s" dur=".5s" fill="freeze"/>
      </text>
      <text y="95" opacity="0">        ╚═════╝ ╚═╝
        <animate attributeName="opacity" values="0;1" begin="1.55s" dur=".5s" fill="freeze"/>
      </text>
    </g>

    <text x="25" y="205" fill="#475569" font-family="monospace" font-size="12">$ whoami</text>
    <text x="25" y="228" fill="#0F172A" font-family="monospace" font-size="16">Noman Khan</text>
    <text x="25" y="252" fill="#475569" font-family="monospace" font-size="12">$ focus --now</text>
    <text x="25" y="275" fill="#0F172A" font-family="monospace" font-size="14">AI • ML • Generative AI</text>

    <g opacity=".75">
      <rect x="25" y="310" width="335" height="1" fill="rgba(15,23,42,.10)"/>
      <text x="25" y="340" fill="#475569" font-family="monospace" font-size="12">STATUS</text>
      <circle cx="92" cy="336" r="5" fill="#10B981">
        <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="105" y="340" fill="#0F172A" font-family="monospace" font-size="12">building intelligent systems</text>
    </g>

    <rect x="25" y="375" width="335" height="55" rx="12" fill="#F8FAFC" stroke="rgba(15,23,42,.10)"/>
    <text x="42" y="398" fill="#475569" font-family="monospace" font-size="11">python • tensorflow • sklearn</text>
    <text x="42" y="417" fill="#475569" font-family="monospace" font-size="11">langchain • streamlit • github</text>
  </g>

  <!-- RIGHT CONTENT -->
  <g transform="translate(470 55)">
    <rect width="665" height="500" rx="22" fill="#FFFFFF" fill-opacity=".45" stroke="rgba(15,23,42,.10)"/>
    <circle cx="25" cy="25" r="5" fill="#FF5F57"/><circle cx="42" cy="25" r="5" fill="#FEBC2E"/><circle cx="59" cy="25" r="5" fill="#28C840"/>
    <text x="82" y="29" fill="#475569" font-family="monospace" font-size="13">profile.md</text>

    <text x="35" y="92" fill="#475569" font-family="sans-serif" font-size="16">Hi 👋</text>
    <text x="35" y="137" fill="#0F172A" font-family="sans-serif" font-size="38" font-weight="700">I'm Noman Khan</text>
    <rect x="35" y="153" width="2" height="28" fill="url(#accent)">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="48" y="175" fill="url(#accent)" font-family="monospace" font-size="20">
      AI Engineer • ML Enthusiast
      <animate attributeName="opacity" values="0;1" begin="1.7s" dur=".7s" fill="freeze"/>
    </text>

    <g font-family="sans-serif" font-size="14">
      <text x="35" y="225" fill="#475569">📍 Karachi, Pakistan</text>
      <text x="35" y="253" fill="#475569">🎓 BS Artificial Intelligence</text>
      <text x="35" y="281" fill="#475569">⚡ Building AI &amp; Machine Learning projects</text>
    </g>

    <text x="35" y="323" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="700">TECH STACK</text>
    <g font-family="sans-serif" font-size="12">
      <g fill="#F8FAFC" stroke="rgba(15,23,42,.10)">
        <rect x="35" y="340" width="72" height="30" rx="15"/><rect x="115" y="340" width="82" height="30" rx="15"/>
        <rect x="205" y="340" width="82" height="30" rx="15"/><rect x="295" y="340" width="88" height="30" rx="15"/>
        <rect x="391" y="340" width="72" height="30" rx="15"/><rect x="471" y="340" width="76" height="30" rx="15"/>
      </g>
      <g fill="#0F172A" text-anchor="middle">
        <text x="71" y="360">Python</text><text x="156" y="360">TensorFlow</text><text x="246" y="360">Scikit-learn</text>
        <text x="339" y="360">Streamlit</text><text x="427" y="360">Git</text><text x="509" y="360">LangChain</text>
      </g>
    </g>

    <rect x="35" y="398" width="595" height="1" fill="rgba(15,23,42,.10)"/>
    <text x="35" y="432" fill="#475569" font-family="sans-serif" font-size="13">github.com/Noman-khan25</text>
    <text x="35" y="458" fill="#475569" font-family="sans-serif" font-size="13">linkedin.com/in/noman-khan</text>

    <!-- particles -->
    <g fill="url(#accent)">
      <circle cx="600" cy="90" r="2"><animate attributeName="cy" values="90;65;90" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="575" cy="115" r="1.5"><animate attributeName="cx" values="575;600;575" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="615" cy="140" r="1.5"><animate attributeName="cy" values="140;115;140" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- scanline -->
  <rect x="10" y="10" width="1160" height="3" fill="url(#accent)" opacity=".16">
    <animate attributeName="y" from="10" to="597" dur="5s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>