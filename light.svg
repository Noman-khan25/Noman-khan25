      <animate attributeName="y2" values="10;270;10" dur="3.5s" repeatCount="indefinite"/>
    </line>

    <rect x="0" y="300" width="400" height="235" rx="10" fill="#F1F5F9" stroke="rgba(15,23,42,0.05)"/>
    <text x="16" y="335" class="mono" font-size="12" fill="#059669">&gt; System.core.initialized(0x0F20)</text>
    <text x="16" y="365" class="mono" font-size="12" fill="#475569">&gt; Loading AI &amp; Innovation stack...</text>
    <text x="16" y="395" class="mono" font-size="12" fill="#2563EB">&gt; Status: Active &amp; Ready</text>
    <text x="16" y="425" class="mono" font-size="12" fill="#7C3AED">&gt; Model_Library: [ResNet, BERT, LLMs]</text>
