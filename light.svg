      <text y="38">1010101 ::::::: ::::::: 101010101010101010</text>
      <text y="54">0101010 ':::::::::::::::::' 01010101010101</text>
      <text y="70">1010101   ':::::::::::::'   10101010101010</text>
      <text y="86">010101001   ':::::::::'   1010101010101010</text>
      <text y="102">10101010101   ':::::'   010101010101010101</text>
      <text y="118">010101001001    ':'    1010101010101010101</text>
      <text y="134">------------------------------------------</text>
      <text y="150">AI CORE ENGINE: ONLINE [RESNET / TRANSFORMER]</text>
      <text y="166">ANALYZING FACIAL DATA MATRICES... 100%</text>
      <text y="182">NEURAL NODES CONNECTED: 8,192 PARAMETERS</text>
      <text y="198">SYSTEM STATUS: OPTIMAL &amp; READY</text>
    </g>

    <line x1="0" y1="10" x2="400" y2="10" stroke="#2563EB" stroke-width="2" opacity="0.4">
