<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <style>
      .text-bold-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #0F172A; }
      .text-sub-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #475569; font-size: 14px; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .pill-light { fill: rgba(241, 245, 249, 0.9); stroke: rgba(37, 99, 235, 0.25); stroke-width: 1.2px; rx: 8px; }
      .pill-txt-light { font-family: -apple-system, sans-serif; font-size: 12px; fill: #2563EB; font-weight: 600; }
      .matrix-txt-light { font-size: 9px; fill: #0284C7; opacity: 0.9; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Clean Light Background -->
  <rect width="1180" height="610" rx="16" fill="#FFFFFF"/>

