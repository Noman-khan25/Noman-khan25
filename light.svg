      <rect x="100" y="0" width="95" height="34" class="pill-light"/><text x="147" y="22" class="pill-txt-light" text-anchor="middle">PyTorch</text>
      <rect x="205" y="0" width="80" height="34" class="pill-light"/><text x="245" y="22" class="pill-txt-light" text-anchor="middle">C++</text>
      <rect x="295" y="0" width="90" height="34" class="pill-light"/><text x="340" y="22" class="pill-txt-light" text-anchor="middle">OpenCV</text>
      <rect x="395" y="0" width="105" height="34" class="pill-light"/><text x="447" y="22" class="pill-txt-light" text-anchor="middle">TensorFlow</text>

      <rect x="0" y="46" width="90" height="34" class="pill-light"/><text x="45" y="68" class="pill-txt-light" text-anchor="middle">Docker</text>
      <rect x="100" y="46" width="80" height="34" class="pill-light"/><text x="140" y="68" class="pill-txt-light" text-anchor="middle">Git</text>
      <rect x="190" y="46" width="95" height="34" class="pill-light"/><text x="237" y="68" class="pill-txt-light" text-anchor="middle">React</text>
      <rect x="295" y="46" width="115" height="34" class="pill-light"/><text x="352" y="68" class="pill-txt-light" text-anchor="middle">Scikit-Learn</text>
    </g>

    <g transform="translate(0, 390)">
      <text x="0" y="20" class="mono" font-size="13" fill="#059669">✦ Building smart models &amp; smarter solutions</text>
    </g>
